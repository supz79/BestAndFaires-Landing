<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071a33">
  <title>Best&Faires</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071a33;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071a33;
    }
    .splash img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Best&Fairest">
    <img src="splash-bf-new.png" alt="Best&Fairest">
  </main>
</body>
</html>
